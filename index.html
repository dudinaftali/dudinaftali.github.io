    <script>
        (function() {
            // Build map: scriptId -> { flowType, env, widgetType }
            var scriptMeta = {};

            // Walk comments to find "Begin" markers
            var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_COMMENT);
            while (walker.nextNode()) {
                var text = walker.currentNode.nodeValue;
                var beginMatch = text.match(/Bizzabo\s+"([^"]+)"\s+Registration Flow Widget Begin/i);
                if (!beginMatch) continue;
                var flowName = beginMatch[1].toLowerCase();
                var flowType = flowName === "rsvp" ? "rsvp" : (flowName === "general admission" ? "trreg" : null);
                if (!flowType) continue;

                // Collect all script nodes in this block until End comment
                var scripts = [];
                var node = walker.currentNode.nextSibling;
                while (node) {
                    if (node.nodeType === 8 && node.nodeValue.match(/Registration Flow Widget End/i)) break;
                    if (node.nodeType === 1 && node.tagName === "SCRIPT" && node.id) scripts.push(node);
                    node = node.nextSibling;
                }

                // Determine block type: has bz-inline-registration-script → inline block, else popout block
                var inlineScript = null, anyScript = null;
                scripts.forEach(function(s) {
                    if (s.id.indexOf("bz-inline-registration-script") === 0) inlineScript = s;
                    if (!anyScript) anyScript = s;
                });

                var representativeScript = inlineScript || anyScript;
                if (!representativeScript) continue;

                var widgetType = inlineScript ? "inline" : "popup";
                var srcMatch = representativeScript.textContent.match(/bz\.src\s*=\s*["']([^"']+)["']/);
                if (!srcMatch) continue;
                var subdomain = srcMatch[1].split("//")[1].split(".")[0];
                var env = subdomain.replace("-organizer", "").toLowerCase();

                if (env && representativeScript.id) {
                    scriptMeta[representativeScript.id] = { flowType: flowType, env: env, widgetType: widgetType };
                }
            }

            // Now update UI elements
            Object.keys(scriptMeta).forEach(function(id) {
                var meta = scriptMeta[id];
                var scriptEl = document.getElementById(id);
                if (!scriptEl) return;
                var eventId = scriptEl.getAttribute("data-event-id");
                if (!eventId) return;

                var envLabel = meta.env.toUpperCase();

                // Show event id next to subsection title (once, not per widget type)
                var eventIdSpan = document.getElementById("eventid-" + meta.env + "-" + meta.flowType);
                if (eventIdSpan && !eventIdSpan.textContent) {
                    eventIdSpan.textContent = "Event Id = " + eventId;
                }

                if (meta.widgetType === "popup") {
                    var btn = document.getElementById("btn-" + meta.env + "-" + meta.flowType + "-popout");
                    if (btn) btn.textContent = "Pop out widget - " + envLabel;
                } else {
                    var title = document.getElementById("inline-title-" + meta.env + "-" + meta.flowType);
                    if (title) title.textContent = "Inline Widget";
                }

                // Update dashboard and event website links for this subsection (once)
                var dashLink = document.getElementById("dashboard-" + meta.env + "-" + meta.flowType);
                if (dashLink && dashLink.style.display === "none") {
                    dashLink.href = "https://" + meta.env + "-accounts.ext.dev.bizzabo.com/9/events/" + eventId + "/dashboard";
                    dashLink.style.display = "inline-block";
                }

                var siteLink = document.getElementById("eventsite-" + meta.env + "-" + meta.flowType);
                if (siteLink && siteLink.style.display === "none") {
                    siteLink.href = "https://" + meta.env + "-events.ext.dev.bizzabo.com/" + eventId;
                    siteLink.style.display = "inline-block";
                }
            });
        })();
    </script>
