    <!-- start script to add Bizzabo lang change listeners to Transifex -->
<script>
Transifex.live.onTranslatePage(function(language_code) {
    $('iframe').each(function(index) {
    var splitSrc = this.src.split('?');
    var srcUrl = splitSrc[0] || '';
    if (srcUrl.indexOf('bizzabo')!= -1){
        var srcSearch = decodeURIComponent(splitSrc[1]) || '';
        var regex = new RegExp("([?;&])lang[^&;]*[;&]?");
        var query = srcSearch.replace(regex, "$1").replace(/&$/, '');
        var newQueryStr = '?' + (query.length > 2 ? query + "&" : "") + (language_code
? "lang=" + language_code : '');
        this.src = srcUrl + newQueryStr;
      }
}); });
</script>
<!-- end script to add Bizzabo lang change listeners to Transifex -->

<!-- script start - wait for Ticket Frame to adjust labels -->
<script>
  /* Wait for registration/ticket iframe popup (one with stripe for payment) */
  if (typeof bizzaboTicketFrameContentMuiPaperObserver === "undefined") {
    console.debug("Creating Mutation Observer for Ticket Frame Attributes");
    var ticketFrame = document.getElementById(
      "bz-registration-frame-952c7914-98bb-4958-8add-066e946ee763"
    );
    function waitForTicketFrameAttributes(mutationList) {
      for (const mutation of mutationList) {
        if (
          mutation.type !== "attributes" ||
          mutation.attributeName !== "src"
        ) {
          continue;
        }
        if (
          mutation.target.id !==
          "bz-registration-frame-952c7914-98bb-4958-8add-066e946ee763"
        ) {
          continue;
        }

        if (mutation.oldValue) {
          // no more Ticket Frame Content
          bizzaboTicketFrameContentMuiPaperObserver.disconnect();
          console.debug("Ticket Frame gone.  Disconnecting Observer...");
        }
      }
    }
    function replaceLabelText(labelElement, newText, lang) {
      if (!labelElement || !newText) {
        return;
      }
      if (lang && lang !== labelElement.ownerDocument.documentElement.lang) {
        console.debug(
          `Label#${labelElement.id}'s language is [${labelElement.ownerDocument.documentElement.lang}] which is not the expected language of [${lang}].  Skipping Text replacement.`
        );
        return;
      }
      console.debug(
        `Label#${labelElement.id} with lang [${labelElement.ownerDocument.documentElement.lang}].  Attempting to replace existing text with [${newText}]...`
      );
      if (labelElement.childElementCount === 0) {
        const oldText = labelElement.innerText;
        labelElement.innerText = newText;
        console.debug(
          `Label#${labelElement.id} text replaced with [${newText}].  Old text was [${oldText}].`
        );
      } else {
        labelElement.childNodes.forEach((node) => {
          if (node.nodeType === 3 && node.nodeValue.trim()) {
            /* #text node */
            const oldText = node.nodeValue;
            node.nodeValue = newText;
            console.debug(
              `Label#${labelElement.id}'s #text node value replaced with [${newText}].  Old value was [${oldText}].`
            );
          }
        });
      }
    }

    function getTicketFrameContentMuiPaperChanges(mutationList) {
      for (const mutation of mutationList) {
        if (mutation.addedNodes.length) {
          for (const addedNode of mutation.addedNodes) {
            if (
              addedNode.nodeName === "DIV" &&
              (addedNode.classList.contains("MuiBox-root") ||
                addedNode.classList.contains("MuiGrid-root"))
            ) {
              /* div.MuiBox-root would contain the labels if the billing page shows up first. (multiple tickets) */
              /* div.MuiGrid-root would contain the individual labels if the billing page shows up after the first form page. (single ticket) */

              const stateLabel = addedNode.querySelector(
                "label#field-id-state-label"
              );
              const zipCodeLabel = addedNode.querySelector(
                "label#field-id-zip-label"
              );
              if (stateLabel) {
                replaceLabelText(stateLabel, "Province/Territory", "en");
              }
              if (zipCodeLabel) {
                replaceLabelText(zipCodeLabel, "Postal Code", "en");
              }
            }
          }
        }
      }
    }

    bizzaboTicketFrameContentMuiPaperObserver = new MutationObserver(
      getTicketFrameContentMuiPaperChanges
    );

    bizzaboTicketFrameAttributeObserver = new MutationObserver(
      waitForTicketFrameAttributes
    );
    bizzaboTicketFrameAttributeObserver.observe(ticketFrame, {
      attributes: true,
      attributeOldValue: true,
    });
    ticketFrame.addEventListener("load", () => {
      if (!ticketFrame.src || !ticketFrame.contentDocument) {
        return;
      }
      console.debug("Ticket Frame Loaded. Connecting Observer...");
      bizzaboTicketFrameContentMuiPaperObserver.observe(
        ticketFrame.contentDocument.querySelector("div.MuiPaper-root"),
        {
          subtree: true,
          childList: true,
        }
      );
    });
  }
</script>
<!-- script end - wait for Ticket Frame to adjust labels -->
